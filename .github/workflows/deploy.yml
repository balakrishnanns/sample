name: Deploy Application

# Controls when the workflow will run
on:
  push:
    branches:
      - main  # Triggers the workflow on push events to the main branch
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the language environment (e.g., Node.js, Python, Java)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run build commands (minification, compilation, etc.)
      - name: Build project
        run: npm run build

      # Step 5: Deploy to your hosting provider/server
      # Replace this step with your specific cloud provider or SSH deployment step
      # Keep sensitive credentials secured inside GitHub Environment Secrets
      - name: Deploy to Production
        env:
          DEPLOY_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        run: |
          echo "Deploying built files to the production environment..."
          # Example deployment command:
          # npm run deploy -- --token=$DEPLOY_API_KEY
